name: CI

"on":
  push:
    branches: [main, master]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: cd frontend && npm run lint
      - run: cd frontend && npm run build:web
      - run: cd frontend && npm run typecheck

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-db.txt
            backend/requirements-test.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt -r requirements-db.txt -r requirements-test.txt
      - run: python -m alembic upgrade head
      - run: pytest -q

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Python dependency audit
        working-directory: backend
        run: |
          python -m pip install --upgrade pip pip-audit
          pip install -r requirements.txt -r requirements-db.txt
          pip-audit -r requirements.txt -r requirements-db.txt --ignore-vuln CVE-2024-23342 --ignore-vuln CVE-2026-1839
      - name: Frontend dependency audit
        run: |
          npm ci
          cd frontend
          npm audit --omit=dev --audit-level=high
